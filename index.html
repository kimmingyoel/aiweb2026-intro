<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모세 by 김민결</title>
  <meta name="description" content="영수증 한 장으로 손쉽게 정산하세요" />
  <link rel="stylesheet" href="style.css" />
  <!-- contents.md inline 렌더용 -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
</head>
<body>

  <!-- ============ HERO ============ -->
  <header class="hero">
    <div class="container">
      <h1>모세</h1>
      <p class="tagline">영수증 한 장으로 손쉽게 정산하세요</p>
    </div>
  </header>

  <main class="container">

    <!-- ============ 데모 카드 ============ -->
    <section class="demo-card">
      <img class="screenshot" src="screenshot.png" alt="모세 데모 화면" />

      <div class="cta">
        <a href="https://s03-demo.aiweb2026.site"
            class="btn btn-primary"
            target="_blank"
            rel="noopener">▶ Live Demo</a>

        <a class="btn btn-secondary" href="https://github.com/kimmingyoel/moses" target="_blank" rel="noopener">
          ⌨ Source on GitHub
        </a>
      </div>
    </section>

    <!-- ============ 본문 (contents.md 인라인 렌더) ============ -->
    <section class="content">
      <zero-md src="contents.md" no-shadow></zero-md>
    </section>

    <!-- ============ Giscus 댓글 ============ -->
    <section id="comments" class="comments">
      <h2>💬 이 프로젝트 어떠세요?</h2>
      <p class="comments-note">
        GitHub 계정으로 로그인하면 댓글이 본인 리포의 GitHub Discussions에 자동 저장됩니다.
      </p>

      <div class="giscus"></div>
      <script src="https://giscus.app/client.js"
        data-repo="kimmingyoel/aiweb2026-intro"
        data-repo-id="R_kgDOSPzqDw"
        data-category="Announcements"
        data-category-id="DIC_kwDOSPzqD84C79e4"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="ko"
        crossorigin="anonymous"
        async>
      </script>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>
        2026 AI 웹 융합 · 모세 데모 소개 페이지 ·
        <a href="https://aiweb2026.site">aiweb2026.site</a>
      </p>
    </div>
  </footer>
</body>
</html>
